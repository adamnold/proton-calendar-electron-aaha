name: proton-calendar-electron-aaha validation
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y minisign imagemagick rpm libcrypt1 flatpak flatpak-builder dbus-daemon
      - name: Install Flatpak build refs
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          dbus-run-session -- flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.electronjs.Electron2.BaseApp//26.08
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: bash build.sh
